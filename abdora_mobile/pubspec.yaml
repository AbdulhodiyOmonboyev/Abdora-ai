name: abdora_mobile
description: "Abdora AI — CRM + ERP + LMS Zamonaviy Mobil Ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.4.1

  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI & Animations
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
