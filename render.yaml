        value: 7d
      - key: AQ.Ab8RN6In6wmHq88x-aqA3nWPJ4TBsIgaLOTb3L5QwNVHFxkBCw
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: UPLOAD_DIR
        value: uploads/

  # ── Frontend (Vite + React – static site) ─────────────────────────────
  - type: web
    name: abdora-ai-frontend
    runtime: static
    region: frankfurt
    rootDir: bialogiya_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
