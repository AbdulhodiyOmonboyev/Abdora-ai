name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abdora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install backend dependencies
      run: cd bialogiya_beakent && npm install
    
    - name: Generate Prisma Client
      run: cd bialogiya_beakent && npx prisma generate || true
    
    - name: Run backend tests
      run: cd bialogiya_beakent && npm test --if-present || true
      continue-on-error: true
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abdora_test

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install frontend dependencies
      run: cd bialogiya_frontend && npm install
    
    - name: Run linting
      run: cd bialogiya_frontend && npm run lint || true
      continue-on-error: true
    
    - name: Build frontend
      run: cd bialogiya_frontend && npm run build

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t abdora-frontend:latest ./bialogiya_frontend || true
      continue-on-error: true

