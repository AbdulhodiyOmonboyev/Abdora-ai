name: Node.js CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies (Frontend)
      run: cd bialogiya_frontend && npm install
    
    - name: Install dependencies (Backend)
      run: cd bialogiya_beakent && npm install
    
    - name: Run linter (Frontend)
      run: cd bialogiya_frontend && npm run lint || true
      continue-on-error: true
    
    - name: Build Frontend
      run: cd bialogiya_frontend && npm run build
    
    - name: Run tests (Frontend)
      run: cd bialogiya_frontend && npm test --if-present || true
      continue-on-error: true
