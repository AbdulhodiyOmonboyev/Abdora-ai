name: Build Abdora Student APK

on:
  push:
    branches: [ main, master, v2/crm-erp-lms ]
    paths:
      - 'abdora_mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd abdora_mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd abdora_mobile
          flutter build apk --release

      - name: Prepare APK File
        run: |
          mkdir -p release-output
          cp abdora_mobile/build/app/outputs/flutter-apk/app-release.apk release-output/Abdora-Student.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abdora-Student-APK
          path: release-output/Abdora-Student.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2/crm-erp-lms'
        with:
          tag_name: v1.0.0-apk
          name: Abdora Student APK v1.0.0
          body: |
            ## Abdora Student — Rasmiy Android APK
            O'quvchilar uchun maxsus ishlab chiqilgan rasmiy Android ilovasi.

            ### Qanday o'rnatiladi:
            1. Quyidagi `Abdora-Student.apk` faylini telefoningizga yuklab oling.
            2. Faylni ochib, o'rnatishni tasdiqlang.
          files: release-output/Abdora-Student.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
